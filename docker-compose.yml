version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HSK_RPC_URL=https://testnet.hsk.xyz
      - HSK_CHAIN_ID=133
      - EXECUTION_MODE=paper
      - DATABASE_URL=sqlite+aiosqlite:///./omnivault.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./omnivault.db:/app/omnivault.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
